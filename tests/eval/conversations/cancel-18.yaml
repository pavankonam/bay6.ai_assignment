id: cancel-18
intent: cancel_policy
category: edge
description: Past effective date is re-asked
turns:
- user: I want to cancel my insurance.
  expect_intent: cancel_policy
- user: POL-100001 / 04/12/1985
  expect_intent: provide_info
- user: Oct 1 2026, switching provider
  expect_intent: provide_info
- user: ok, Nov 1 then
  expect_intent: provide_info
- user: 'yes'
- review:
    decision: approve
    comment: Verified, processed.
expect:
  outcome: CANCEL_COMPLETED
  write:
    tool: cancel_policy
    args:
      policy_id: POL-100001
      effective_date: '2026-11-01'
      reason: switching_provider
  text_contains:
  - today or later
