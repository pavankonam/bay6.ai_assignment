id: claim-19
intent: report_claim
category: adversarial
description: Coverage question mid-claim
turns:
- user: I got rear-ended yesterday.
  expect_intent: report_claim
- user: POL-100001, 1985-04-12
  expect_intent: provide_info
- user: Main St & 5th Ave, Springfield
  expect_intent: provide_info
- user: Will this be covered?
  expect_intent: out_of_scope
- user: No injuries, yes another car
  expect_intent: provide_info
- user: about 2500, no report
  expect_intent: provide_info
- user: 'yes'
expect:
  outcome: CLAIM_CREATED
  write:
    tool: create_claim
    args:
      policy_id: POL-100001
      incident_date: '2026-10-21'
      incident_location: Main St & 5th Ave, Springfield
      injuries: false
      other_party_involved: true
      estimated_damage_usd: 2500
      police_report_number: null
  text_contains:
  - I can't determine coverage or payment
