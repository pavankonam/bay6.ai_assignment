id: cancel-03
intent: cancel_policy
category: happy
description: Sold vehicle, 'next Friday'
turns:
- user: I sold my car, so I need to cancel my policy.
  expect_intent: cancel_policy
- user: POL-100001, born 4/12/1985
  expect_intent: provide_info
- user: make it effective next Friday
  expect_intent: provide_info
- user: 'yes'
- review:
    decision: approve
    comment: Verified, processed.
expect:
