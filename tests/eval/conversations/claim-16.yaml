id: claim-16
intent: report_claim
category: edge
description: Future incident date is rejected, then corrected
turns:
- user: I had an accident on 2026-10-30. POL-100001, born 4/12/1985
  expect_intent: report_claim
- user: sorry, it was 2026-10-20
  expect_intent: provide_info
- user: Main St & 5th Ave, Springfield, I was rear-ended
  expect_intent: provide_info
- user: No injuries, yes another car
  expect_intent: provide_info
- user: about 2500, no report
  expect_intent: provide_info
- user: 'yes'
expect:
  outcome: CLAIM_CREATED
  write:
    tool: create_claim
    args:
      policy_id: POL-100001
      incident_date: '2026-10-20'
  text_contains:
  - can't be in the future
