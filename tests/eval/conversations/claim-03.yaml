id: claim-03
intent: report_claim
category: happy
description: '''last Tuesday'' and ''$2.5k'''
turns:
- user: My car was hit last Tuesday while it was parked on Elm Street.
  expect_intent: report_claim
- user: POL-100001, born 4/12/1985
  expect_intent: provide_info
- user: no one was hurt, and yes, the other driver left a note
  expect_intent: provide_info
- user: $2.5k, no police report
  expect_intent: provide_info
- user: 'yes'
expect:
  outcome: CLAIM_CREATED
  write:
    tool: create_claim
    args:
      policy_id: POL-100001
      incident_date: '2026-10-20'
      injuries: false
      other_party_involved: true
      estimated_damage_usd: 2500
  max_turns: 7
